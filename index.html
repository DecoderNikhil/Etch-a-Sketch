<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch a Sketch</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <h1>Etch-a-Sketch</h1>
    <div class="container">
      <div class="settings">
        <!-- Coloring buttons -->
        <button class="btn randomColor">Magic Colors</button>
        <button class="btn shading">Shading</button>
        <button class="btn colorPicker">Pick Color</button>
        <input type="color" class="penColor" value="#000000" style="display: none" />
        <button class="btn changeSize">Change Size</button>
      </div>

      <div class="smallContainer">
        <!-- Grid Container -->
        <div class="board"></div>

        <!-- Board Control Buttons -->
        <div class="buttons">
          <button class="btn erase">Erase</button>
          <button class="btn reset">Reset</button>
        </div>
      </div>
    </div>
  </body>
</html>
